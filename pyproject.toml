[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visitor-counter"
version = "1.0.0"
description = "Native Linux desktop suite for a dual-camera YOLO26m Hailo visitor counter"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0",
  "numpy>=1.24",
  "opencv-python>=4.8,<5",
  "paramiko>=3.4",
  "psutil>=5.9",
  "PySide6>=6.6",
  "PyYAML>=6.0",
]

[project.scripts]
visitor-counter = "visitor_counter.app:main"
visitor-counter-service = "visitor_counter.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -m 'not hardware'"
markers = [
  "hardware: requires Raspberry Pi cameras, HailoRT and compiled HEF",
]
