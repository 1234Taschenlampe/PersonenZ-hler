name: Tagezaehler Android APK
on:
  push:
    branches:
      - build/tagezaehler-android-20261102
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK 36 installieren
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Projekt entpacken
        run: mkdir -p countdown && tar -xzf tagezaehler-build/source.tgz -C countdown
      - name: Android APK kompilieren
        working-directory: countdown
        run: gradle --no-daemon :app:assembleDebug
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Tagezaehler-APK
          path: countdown/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
